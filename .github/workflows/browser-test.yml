name: Verify official Chrome in Linux VMs
on:
 push:
  branches: [runtime-1.0]
  paths: ['setup-binux-desktop', 'scripts/runtime-guest-checks.py', 'scripts/test-runtime-image.py', '.github/workflows/browser-test.yml']
 workflow_dispatch:
permissions:
 contents: read
concurrency:
 group: binux-browser-validation
 cancel-in-progress: true
jobs:
 browser:
  runs-on: ubuntu-24.04
  timeout-minutes: 45
  strategy:
   fail-fast: false
   matrix: {distribution: [debian, ubuntu]}
  steps:
   - uses: actions/checkout@v4
   - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libslirp-dev libfdt-dev libattr1-dev zlib1g-dev
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python3 -m pip install meson==1.6.1 ninja==1.11.1.1
   - uses: actions/cache@v4
     id: engine
     with:
      path: native/build/vm-host/qemu-system-aarch64
      key: host-qemu-${{ hashFiles('scripts/build-host-vm.sh', 'third_party/vm/sources.json', 'third_party/vm/patches/**') }}
   - run: bash scripts/build-host-vm.sh
     if: steps.engine.outputs.cache-hit != 'true'
   - uses: actions/cache/restore@v4
     with:
      path: artifacts/runtime
      key: runtime-arm64-${{ matrix.distribution }}-${{ hashFiles('scripts/build-runtime-image.sh', 'runtime/guest/**', 'runtime/trust/**') }}
      fail-on-cache-miss: true
   - run: python3 scripts/test-runtime-image.py '${{ matrix.distribution }}' artifacts/runtime --browser-only --qemu native/build/vm-host/qemu-system-aarch64
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: 'browser-boot-log-${{ matrix.distribution }}', path: 'artifacts/runtime/*-boot-test.log'}
