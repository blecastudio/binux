name: Build Linux VM runtime images
on:
 push:
  branches: ['runtime-1.0']
  paths: ['runtime/**', 'scripts/build-runtime-image.sh', 'scripts/test-runtime-image.py', 'scripts/runtime-guest-checks.py', '.github/workflows/runtime-images.yml']
 workflow_dispatch:
permissions:
 contents: write
 actions: write
concurrency:
 group: binux-runtime-images
 cancel-in-progress: true
jobs:
 cleanup:
  runs-on: ubuntu-24.04
  steps:
   - env: {GH_TOKEN: '${{ github.token }}'}
     run: |
      gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=runtime-1.0&per_page=30" --jq '.workflow_runs[] | select(.name=="Build Linux VM runtime images" and (.status=="in_progress" or .status=="queued")) | .id' > old-runs.txt
      while read -r run_id; do
       if [ "$run_id" != "$GITHUB_RUN_ID" ];then gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true;fi
      done < old-runs.txt
 images:
  needs: cleanup
  runs-on: ubuntu-24.04
  timeout-minutes: 100
  strategy:
   fail-fast: false
   matrix: {distribution: [debian, ubuntu]}
  steps:
   - uses: actions/checkout@v4
   - run: sudo apt-get update && sudo apt-get install -y debootstrap qemu-user-static binfmt-support qemu-utils ubuntu-keyring libglib2.0-dev libslirp-dev libfdt-dev libattr1-dev zlib1g-dev
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python3 -m pip install meson==1.6.1 ninja==1.11.1.1
   - uses: actions/cache@v4
     id: engine
     with:
      path: native/build/vm-host/qemu-system-aarch64
      key: host-qemu-${{ hashFiles('scripts/build-host-vm.sh', 'third_party/vm/sources.json', 'third_party/vm/patches/**') }}
   - run: bash scripts/build-host-vm.sh
     if: steps.engine.outputs.cache-hit != 'true'
   - uses: actions/cache/save@v4
     if: steps.engine.outputs.cache-hit != 'true'
     with:
      path: native/build/vm-host/qemu-system-aarch64
      key: host-qemu-${{ hashFiles('scripts/build-host-vm.sh', 'third_party/vm/sources.json', 'third_party/vm/patches/**') }}
   - run: sudo update-binfmts --enable qemu-aarch64
   - uses: actions/cache@v4
     id: images
     with:
      path: artifacts/runtime
      key: runtime-arm64-${{ matrix.distribution }}-${{ hashFiles('scripts/build-runtime-image.sh', 'runtime/guest/**', 'runtime/trust/**') }}
   - run: scripts/build-runtime-image.sh '${{ matrix.distribution }}' artifacts/runtime
     if: steps.images.outputs.cache-hit != 'true'
   - name: Preserve exact source provenance of cached base images
     env:
      DISTRIBUTION: '${{ matrix.distribution }}'
      CACHE_HIT: '${{ steps.images.outputs.cache-hit }}'
      BUILDER_HASH: '${{ hashFiles(''scripts/build-runtime-image.sh'', ''runtime/guest/**'', ''runtime/trust/**'') }}'
     run: |
      record="artifacts/runtime/$DISTRIBUTION-binux-source-commit.txt"
      if [ ! -f "$record" ];then
       if [ "$CACHE_HIT" = true ];then
        # Legacy cache built and saved by verified workflow run 38654280893.
        test "$BUILDER_HASH" = 25c7161b94583f8ac1aa3754f87f115deefa024cf66f207ea52dcb0f8f95e3f7
        echo a498d4070a5d804342e2bb106cf76a1a9522458e > "$record"
       else echo "$GITHUB_SHA" > "$record";fi
      fi
      image_source=$(cat "$record")
      git fetch --depth=1 origin "$image_source"
      git archive --format=tar.gz "$image_source" LICENSE core runtime/guest setup-binux-desktop scripts/build-runtime-image.sh > "artifacts/runtime/$DISTRIBUTION-binux-corresponding-source.tar.gz"
   - uses: actions/cache/save@v4
     if: steps.images.outputs.cache-hit != 'true'
     with:
      path: artifacts/runtime
      key: runtime-arm64-${{ matrix.distribution }}-${{ hashFiles('scripts/build-runtime-image.sh', 'runtime/guest/**', 'runtime/trust/**') }}
   - run: python3 scripts/test-runtime-image.py '${{ matrix.distribution }}' artifacts/runtime --qemu native/build/vm-host/qemu-system-aarch64
   - uses: actions/upload-artifact@v4
     if: always()
     with: {name: 'runtime-boot-log-${{ matrix.distribution }}', path: 'artifacts/runtime/*-boot-test.log'}
   - uses: actions/upload-artifact@v4
     with: {name: 'runtime-${{ matrix.distribution }}', path: artifacts/runtime, compression-level: 0}
 publish:
  needs: images
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/download-artifact@v4
     with: {pattern: 'runtime-*', merge-multiple: true, path: artifacts/runtime}
   - name: Hash immutable runtime artifacts
     run: |
      python3 - <<'PY'
      import hashlib,json,pathlib,os
      root=pathlib.Path('artifacts/runtime');tag='runtime-'+os.environ['GITHUB_SHA'][:12]
      assets={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'url':f'https://github.com/blecastudio/binux/releases/download/{tag}/{p.name}'} for p in root.iterdir()}
      image_sources={name:(root/f'{name}-binux-source-commit.txt').read_text().strip() for name in ('debian','ubuntu')}
      (root/'manifest.json').write_text(json.dumps({'schema':1,'source_commit':os.environ['GITHUB_SHA'],'image_source_commits':image_sources,'architecture':'aarch64','disk_bytes':10737418240,'assets':assets},indent=2)+'\n')
      PY
   - env: {GH_TOKEN: '${{ github.token }}'}
     run: gh release create "runtime-${GITHUB_SHA:0:12}" artifacts/runtime/* --prerelease --title 'binux Debian/Ubuntu ARM64 VM data' --notes 'Guest disks, kernels and initrds. These are data for the APK-packaged VM, not Android native executable downloads. Package/source versions are included.' --target "$GITHUB_SHA"
