name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
 contents: read
jobs:
 host:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - run: python -m pip install .
   - run: cmake -S native -B native/build/host && cmake --build native/build/host
   - run: bash scripts/test-host.sh
 android:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '21'}
   - uses: android-actions/setup-android@v3
   - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: sudo apt-get update && sudo apt-get install -y bison m4 patch
   - run: python3 scripts/prepare-x11.py
   - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/build-android-bash.sh
   - run: cd android && ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest
   - run: python scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk
   - run: python scripts/verify-apk.py --kind x11 android/desktop-x11/build/outputs/apk/debug/desktop-x11-debug.apk
   - uses: actions/upload-artifact@v4
     with:
      name: binux-android-arm64-debug
      path: |
       android/app/build/outputs/apk/
       android/desktop-x11/build/outputs/apk/
 windows:
  runs-on: windows-2022
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: {dotnet-version: '10.0.x'}
   - run: dotnet publish windows -c Release -r win-x64 --self-contained false -o artifacts/windows
   - uses: actions/upload-artifact@v4
     with: {name: binux-windows-x64, path: artifacts/windows}
