name: Publish verified development preview
on:
 push:
  tags: ['v1.0.0']
 workflow_dispatch:
permissions:
 contents: write
jobs:
 publish:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.12'}
   - run: python -m pip install 'cryptography>=43,<51'
   - run: cd downloads/1.0 && sha256sum -c SHA256SUMS
   - run: python scripts/verify-apk.py downloads/1.0/binux-1.0.0-android-arm64-debug.apk
   - run: python scripts/verify-apk.py --kind x11 downloads/1.0/binux-desktop-x11-1.0.0-android-arm64-debug.apk
   - run: python scripts/verify-addons.py downloads/1.0/binux-addons.json
   - name: Publish source-matched APKs and installer
     env:
      GH_TOKEN: ${{ github.token }}
     run: gh release create v1.0.0 downloads/1.0/* setup-binux-desktop --title 'binux 1.0.0 + Desktop:X11 1.0.0 (development preview)' --notes-file docs/RELEASE-1.0.0.md --prerelease --target "$GITHUB_SHA"
