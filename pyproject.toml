[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binux"
version = "0.1.0"
description = "BlecaStudio Linux development environment: host validation tools"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["cryptography>=43,<51"]

[project.scripts]
binux = "binux.cli:main"
wbs = "binux.wbs:main"

[tool.setuptools]
package-dir = {"" = "core"}

[tool.setuptools.packages.find]
where = ["core"]
