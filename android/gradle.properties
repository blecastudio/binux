android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# Compose, Room/KSP and two native apps share the in-process Kotlin/lint JVM.
# Gradle's default 384 MiB metaspace is insufficient on a clean CI build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
