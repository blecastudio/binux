plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
 id 'com.google.devtools.ksp'
}
android {
 namespace 'studio.bleca.binux'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'studio.bleca.binux'
  minSdk 26
  targetSdk 35
  versionCode 4
  versionName '1.0.0'
  ndk { abiFilters 'arm64-v8a' }
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget='17' }
 packaging { resources.excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']; jniLibs { useLegacyPackaging=true; keepDebugSymbols += ['**/libbinux_bash.so'] } }
 externalNativeBuild { cmake { path '../../native/CMakeLists.txt'; version '3.22.1' } }
 lint { abortOnError=true }
 testOptions { unitTests { includeAndroidResources=true } }
 sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/binux-assets')
}
ksp { arg('room.schemaLocation', "$projectDir/schemas") }
configurations { robolectricSdk34; robolectricSdk35 }
dependencies {
 implementation 'com.github.mwiede:jsch:0.2.26'
 implementation 'net.i2p.crypto:eddsa:0.3.0'
 implementation platform('androidx.compose:compose-bom:2025.04.01')
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.activity:activity-compose:1.10.1'
 implementation 'androidx.room:room-runtime:2.7.1'
 implementation 'androidx.room:room-ktx:2.7.1'
 ksp 'androidx.room:room-compiler:2.7.1'
 implementation 'androidx.datastore:datastore-preferences:1.1.5'
 implementation project(':terminal-view')
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 robolectricSdk34 'org.robolectric:android-all-instrumented:14-robolectric-10818077-i7'
 robolectricSdk35 'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.register('prepareRobolectricSdk',Copy) {
 from configurations.robolectricSdk34
 from configurations.robolectricSdk35
 into layout.buildDirectory.dir('robolectric-sdk')
}
tasks.withType(Test).configureEach {
 dependsOn 'prepareRobolectricSdk'
 // Gradle resolves and caches SDK jars with its configured proxy/CA.
 // The test worker must not download into or lock the user's home directory.
 systemProperty 'robolectric.offline', 'true'
 systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric-sdk').get().asFile.absolutePath
}
tasks.register('verifyBundledBash') {
 doLast { if (!file('src/main/jniLibs/arm64-v8a/libbinux_bash.so').exists()) throw new GradleException('Run scripts/build-android-bash.sh first: no Bash binary is bundled') }
}
tasks.register('verifyBundledRuntime') {
 doLast {
  if (!file('src/main/jniLibs/arm64-v8a/libbinux_vm.so').exists()) throw new GradleException('Run scripts/build-android-vm.sh first')
  if (!file('src/main/assets/runtime-manifest.json').exists()) throw new GradleException('Pin a successfully boot-tested runtime Release using scripts/pin-runtime.py first')
 }
}
tasks.register('prepareGuestAssets') {
 inputs.dir('../../core/binux')
 inputs.file('../../setup-binux-desktop')
 outputs.dir(layout.buildDirectory.dir('generated/binux-assets'))
 doLast {
  def out=layout.buildDirectory.dir('generated/binux-assets').get().asFile
  copy { from '../../core/binux';into new File(out,'guest-core/binux');exclude '**/__pycache__/**' }
  copy { from '../../setup-binux-desktop';into out }
  def hash=java.security.MessageDigest.getInstance('SHA-256').digest(file('../../setup-binux-desktop').bytes).encodeHex().toString()
  new File(out,'installer-manifest.json').text=groovy.json.JsonOutput.toJson([url:'https://raw.githubusercontent.com/blecastudio/binux/main/setup-binux-desktop',sha256:hash])
 }
}
tasks.named('preBuild').configure { dependsOn 'verifyBundledBash','verifyBundledRuntime','prepareGuestAssets' }
