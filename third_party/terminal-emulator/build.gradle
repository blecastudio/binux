plugins { id 'com.android.library' }
android {
 namespace 'com.termux.terminal'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig { externalNativeBuild { ndkBuild { arguments 'APP_LDFLAGS=-Wl,-z,max-page-size=16384' } }; minSdk 26; ndk { abiFilters 'arm64-v8a' } }
 sourceSets {
  main { java.srcDirs=['src/main/java'] }
  test { java.srcDirs=['src/test/java'] }
 }
 externalNativeBuild { ndkBuild { path 'src/main/jni/Android.mk' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

// Run the existing upstream tests on every explicit readiness verification.
tasks.withType(Test).configureEach { outputs.upToDateWhen { false } }
