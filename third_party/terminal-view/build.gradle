plugins { id 'com.android.library' }
android {
 namespace 'com.termux.view'
 compileSdk 35
 defaultConfig { minSdk 26 }
 sourceSets { main { java.srcDirs=['src/main/java']; res.srcDirs=['src/main/res'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'androidx.annotation:annotation:1.3.0'; api project(':terminal-emulator') }
